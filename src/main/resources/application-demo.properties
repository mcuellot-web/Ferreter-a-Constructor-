# Perfil de demostracion local: no requiere Supabase.
# Ejecutar con: mvn -Pdemo spring-boot:run -Dspring-boot.run.profiles=demo
spring.datasource.url=jdbc:h2:mem:ferreteria;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-demo.sql

# Consola H2 (opcional): http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
